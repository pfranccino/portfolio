<!DOCTYPE html>
<html><head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    /* Same tokens as the site's light theme (src/index.css) */
    body {
      background: #DCE4D3;
      color: #14201A;
      font-family: 'Outfit', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 24px;
      padding: 76px 90px;
      position: relative;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      color: #3A4A40;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #2E7D46;
    }

    .name {
      font-size: 96px;
      font-weight: 500;
      letter-spacing: -.035em;
      line-height: .95;
    }

    .role {
      font-size: 34px;
      font-weight: 400;
      color: #4E5E55;
      letter-spacing: -.01em;
    }

    .role b {
      color: #A63B15;
      font-weight: 600;
    }

    .foot {
      position: absolute;
      left: 90px;
      right: 90px;
      bottom: 56px;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid #B4C2A8;
      padding-top: 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      color: #3A4A40;
    }
  </style>
</head>
<body>
  <div class="eyebrow"><span class="dot"></span>Disponible para conversar · Santiago, Chile</div>
  <div class="name">Paul Franccino</div>
  <div class="role"><b>Android Senior.</b> Construyendo con Kotlin desde 2019.</div>

  <div class="foot">
    <span>Kotlin · Jetpack Compose · MVI</span>
    <span>pfranccino.dev</span>
  </div>
</body>
</html>
