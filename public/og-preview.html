<!DOCTYPE html>
<html><head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    /* Same tokens as the site's light theme (src/index.css) */
    body {
      background: #EDEFF0;
      color: #15181B;
      font-family: 'Archivo', sans-serif;
      display: grid;
      grid-template-columns: 1fr 330px;
      gap: 64px;
      align-items: center;
      padding: 72px 90px 110px;
      position: relative;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      color: #3F454B;
      margin-bottom: 28px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #1F7A45;
    }

    .role {
      font-stretch: 122%;
      font-weight: 800;
      font-size: 84px;
      line-height: 1.02;
      letter-spacing: -.03em;
    }

    .mark {
      background: #F2C230;
      padding: 0 .12em;
    }

    .name {
      margin-top: 24px;
      font-size: 34px;
      color: #3F454B;
      letter-spacing: -.01em;
    }

    .photo img {
      display: block;
      width: 330px;
      height: 400px;
      object-fit: cover;
      border-radius: 2px;
    }

    .photo::after {
      content: "";
      display: block;
      width: 40%;
      height: 8px;
      margin-top: 12px;
      background: #F2C230;
    }

    .foot {
      position: absolute;
      left: 90px;
      right: 90px;
      bottom: 44px;
      display: flex;
      justify-content: space-between;
      border-top: 2px solid #15181B;
      padding-top: 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      color: #3F454B;
    }
  </style>
</head>
<body>
  <div>
    <div class="eyebrow"><span class="dot"></span>Disponible para conversar · Santiago, Chile</div>
    <div class="role"><span class="mark">Staff</span> Android Engineer.</div>
    <div class="name">Paul Franccino. Construyendo con Kotlin desde 2019.</div>
  </div>
  <div class="photo"><img src="img/profile.webp" alt=""></div>

  <div class="foot">
    <span>Kotlin · Gradle · Arquitectura modular</span>
    <span>pfranccino.dev</span>
  </div>
</body>
</html>
